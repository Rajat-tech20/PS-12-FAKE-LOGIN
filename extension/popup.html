<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusAuthGuard Popup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="extension-popup">
      <!-- Popup Header -->
      <header class="popup-header">
        <div class="popup-title">🛡️ CampusAuthGuard</div>
        <div class="settings-icon">⚙️</div>
      </header>

      <!-- Status Section -->
      <div class="status-section safe" id="statusSection">
        <div class="shield-icon safe-shield" id="shieldIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="status-text" id="statusText">Authentic Portal</div>
        <div class="status-domain" id="statusDomain">login.college.edu</div>
      </div>

      <!-- Analysis Details Section -->
      <div class="history-section">
        <div class="history-title">PAGE ANALYSIS DETAILS</div>
        <ul class="history-list">
          <li class="history-item safe-item" id="itemDomain">
            <span class="history-domain" id="lblDomain">Official Domain</span>
            <span class="history-badge" id="badgeDomain">VERIFIED ✅</span>
          </li>
          <li class="history-item" id="itemScore">
            <span class="history-domain">Similarity Match</span>
            <span class="history-badge" id="badgeScore" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8;">100% MATCH</span>
          </li>
          <li class="history-item" id="itemPass">
            <span class="history-domain">Password Field</span>
            <span class="history-badge" id="badgePass" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b;">DETECTED</span>
          </li>
        </ul>

        <button type="button" class="demo-toggle-btn" id="btnToggleOverlay" style="display: none;">
          ⚠️ View Security Alert Overlay
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
